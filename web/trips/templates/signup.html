{% extends "base.html" %}
{% block title %}Create account · TripSplit{% endblock %}
{% block content %}
<section class="card form-stack">
    <h1>Create account</h1>
    <form method="post" data-disable-on-submit>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign up</button>
    </form>
    <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
