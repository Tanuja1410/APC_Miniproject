{% extends "base.html" %}
{% block title %}Log in · TripSplit{% endblock %}
{% block content %}
<section class="card form-stack">
    <h1>Log in</h1>
    <form method="post" data-disable-on-submit>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    <p class="muted">New to TripSplit? <a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
